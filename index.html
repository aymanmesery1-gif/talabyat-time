<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>وصول الطلبيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Mobile check-in: the link carries the manager's token -> his branches -> scheduled hour + on time / late (1-6 h). */
:root{
  --bg:#F2F5F8; --card:#FFFFFF; --ink:#13212E; --ink2:#4B5B6A; --mute:#8794A1; --line:#E1E7ED; --soft:#EAF3FA;
  --acc:#0063A6; --acc2:#01ACE2; --k:#C9771A; --k-bg:#FCF1DF;
  --ok:#1C8A4C; --ok-bg:#E2F3E8; --late:#C0571B; --late-bg:#FBEADF; --bad:#CF3A33;
  --display:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic","Cairo",Tahoma,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(19,33,46,.05),0 8px 22px -16px rgba(19,33,46,.3); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D141B; --card:#152029; --ink:#EAF0F5; --ink2:#B3C0CC; --mute:#7F8D9A; --line:#24323E; --soft:#11293B;
  --acc:#4DB3EE; --acc2:#7FD3F5; --k:#EDA64A; --k-bg:#3A2A12; --ok:#4CC97F; --ok-bg:#12301F; --late:#F08A4E; --late-bg:#3A2316; --bad:#F07067;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.7); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);margin:0;line-height:1.3;font-size:1.45rem;font-weight:800}
.band{background:linear-gradient(110deg,#0063A6,#0A7FC4 60%,#01ACE2);color:#fff;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 22px;border-radius:0 0 20px 20px}
.band .in{max-width:720px;margin-inline:auto}
.band p{margin:4px 0 0;opacity:.92;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);background:var(--bg);border-radius:999px}
.seg button{font:inherit;font-weight:700;font-size:.92rem;border:0;background:transparent;color:var(--ink2);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-weight:700;font-size:.8rem;background:var(--line);color:var(--ink2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.late{background:var(--late-bg);color:var(--late)}
.msg{font-size:.92rem;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 14px}
.msg.warn{background:var(--late-bg);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px}
.br{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;border-inline-start:6px solid var(--line)}
.br.on{border-inline-start-color:var(--ok)} .br.late{border-inline-start-color:var(--late)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-family:var(--display);font-weight:800;font-size:1.15rem}
.chip{font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--acc)}
.chip.K{background:var(--k-bg);color:var(--k)}
.fd{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--ink2);font-weight:600}
select{font:inherit;font-size:1.02rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-weight:700;font-size:1rem;border-radius:12px;padding:12px 14px;cursor:pointer;border:2px solid transparent;flex:1 1 140px;min-height:50px}
.btn.ok{background:var(--ok);color:#fff} .btn.lt{background:var(--late-bg);color:var(--late);border-color:var(--late)}
.btn.lt[aria-pressed="true"]{background:var(--late);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.hrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hrs button{font:inherit;font-weight:700;font-size:.95rem;border:1.5px solid var(--late);background:var(--card);color:var(--late);border-radius:10px;padding:11px 4px;cursor:pointer}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.done .t{display:flex;flex-direction:column;gap:2px}
.done small{color:var(--mute);font-weight:500;font-size:.82rem}
.done .ok{color:var(--ok)} .done .late{color:var(--late)}
.edit{font:inherit;font-size:.88rem;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--acc);border-radius:999px;padding:7px 16px;cursor:pointer}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.foot{font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<div class="band"><div class="in">
  <h1>تأكيد وصول الطلبيات</h1>
  <p id="who">بيحمّل…</p>
</div></div>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="seg" id="day" role="group" aria-label="اليوم"><button type="button" data-d="0" aria-pressed="true">النهارده</button><button type="button" data-d="1" aria-pressed="false">امبارح</button></div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="msg" id="st">بيحمّل فروعك…</div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot" hidden>اختار موعد الوصول، وبعدين دوس «وصلت في الموعد» أو «اتأخرت». وقت التسجيل بيتحفظ أوتوماتيك. لو غلطت دوس «تعديل».</div>
</div>
<script>
const SB='https://nmawgqshvahvfkxyrcpv.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tYXdncXNodmFodmZreHlyY3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDE3NjgsImV4cCI6MjEwNDUxNzc2OH0.N3yd4dSEuWfQrs8kYdOdDxWDxUq--NisnbXX-bAXF4I';
const TOKEN=location.hash.replace(/^#/,'').trim();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HL=h=>h===0?'12 بالليل':h<12?`${h} الصبح`:h===12?'12 الضهر':`${h-12} ${h<17?'العصر':'بالليل'}`;
const tl=iso=>new Date(iso).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit',timeZone:'Africa/Cairo'});
const LH=n=>n===1?'ساعة':n===2?'ساعتين':n+' ساعات';
const HRS=[...Array(19)].map((_,i)=>i+5);
let S=null, OFF=0, TODAY=null, LATE={}, ERR={}, BUSY={}, EDIT={}, SCHED={};
async function rpc(fn,body){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null); if(!r.ok)throw new Error((j&&j.message)||('http_'+r.status)); return j}
const dayStr=()=>{const d=new Date(TODAY+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-OFF);return d.toISOString().slice(0,10)};
async function load(){
  if(!TOKEN){$('who').textContent='اللينك ناقص';$('st').textContent='افتح اللينك اللي اتبعتلك بالظبط، هو فيه الكود بتاعك.';$('st').className='msg warn';return}
  $('st').textContent='بيحمّل فروعك…';$('st').className='msg';
  try{
    if(!TODAY){const f=await rpc('delivery_my_day',{p_token:TOKEN,p_day:new Date().toISOString().slice(0,10)}).catch(()=>null);TODAY=f?f.today:null}
    if(!TODAY){const d=new Date(Date.now()+2*3600e3);TODAY=d.toISOString().slice(0,10)}
    S=await rpc('delivery_my_day',{p_token:TOKEN,p_day:dayStr()});
    $('who').textContent=`مدير المنطقة: ${S.manager}`;$('bar').hidden=false;$('foot').hidden=false;
    $('st').textContent=`${OFF?'امبارح':'النهارده'} ${dayStr()}`;
  }catch(e){
    const m=String(e.message);
    $('st').textContent=m.includes('bad_token')?'اللينك ده مش صحيح. اطلب اللينك بتاعك من جديد.':'مش قادر يوصل للسيستم دلوقتي. اتأكد من النت وافتح الصفحة تاني.';
    $('st').className='msg warn';S=null}
  render()}
function render(){
  if(!S){$('list').innerHTML='';return}
  const R=S.rows||{}, B=S.branches, on=B.filter(b=>R[b.k]&&R[b.k].st==='on').length, lt=B.filter(b=>R[b.k]&&R[b.k].st==='late').length;
  $('prog').innerHTML=`<span class="pill ok">في الموعد ${on}</span><span class="pill late">متأخر ${lt}</span><span class="pill">لسه ${B.length-on-lt}</span>`;
  $('list').innerHTML=B.map(b=>{const r=R[b.k];
    const head=`<div class="hd"><span class="nm">${esc(b.n)}</span><span class="chip ${b.b}">${b.b==='K'?'كنافة':'ب لبن'}</span></div>`;
    if(r&&!EDIT[b.k])return `<div class="br ${r.st}">${head}<div class="done"><span class="t">${r.st==='on'?'<span class="ok">وصلت في الموعد</span>':`<span class="late">اتأخرت ${LH(r.late)}</span>`}<small>الموعد ${HL(r.sched)} · اتسجل ${tl(r.at)}</small></span><button type="button" class="edit" data-e="${b.k}">تعديل</button></div></div>`;
    const sel=SCHED[b.k]??(r?r.sched:'');
    const dis=BUSY[b.k]?'disabled':'';
    return `<div class="br">${head}
      <label class="fd" for="h_${b.k}">موعد الوصول<select id="h_${b.k}" data-h="${b.k}"><option value="">اختار الساعة</option>${HRS.map(h=>`<option value="${h}"${String(h)===String(sel)?' selected':''}>${HL(h)}</option>`).join('')}</select></label>
      <div class="row"><button type="button" class="btn ok" data-on="${b.k}" ${dis}>${BUSY[b.k]?'بيسجّل…':'وصلت في الموعد'}</button><button type="button" class="btn lt" data-lt="${b.k}" aria-pressed="${!!LATE[b.k]}" ${dis}>اتأخرت عن الموعد</button></div>
      ${LATE[b.k]?`<div class="fd">اتأخرت قد إيه؟<div class="hrs">${[1,2,3,4,5,6].map(n=>`<button type="button" data-lh="${b.k}" data-n="${n}" ${dis}>${LH(n)}</button>`).join('')}</div></div>`:''}
      ${ERR[b.k]?`<div class="err">${esc(ERR[b.k])}</div>`:''}</div>`}).join('');
  $('list').querySelectorAll('[data-h]').forEach(x=>x.onchange=()=>{SCHED[x.dataset.h]=x.value;if(ERR[x.dataset.h]){delete ERR[x.dataset.h];render()}});
  $('list').querySelectorAll('[data-on]').forEach(x=>x.onclick=()=>save(x.dataset.on,'on',0));
  $('list').querySelectorAll('[data-lt]').forEach(x=>x.onclick=()=>{const k=x.dataset.lt;if(need(k)==null)return;LATE[k]=!LATE[k];render()});
  $('list').querySelectorAll('[data-lh]').forEach(x=>x.onclick=()=>save(x.dataset.lh,'late',+x.dataset.n));
  $('list').querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{EDIT[x.dataset.e]=1;render()});
}
function need(k){const v=SCHED[k]??'';if(v===''){ERR[k]='اختار موعد الوصول الأول';render();return null}return +v}
async function save(k,st,late){
  const h=need(k);if(h==null)return;
  BUSY[k]=1;delete ERR[k];render();
  try{const r=await rpc('delivery_record',{p_token:TOKEN,p_day:dayStr(),p_branch:k,p_sched:h,p_status:st,p_late:late});
    S.rows={...(S.rows||{}),[k]:{sched:h,st,late,at:r.at}};delete LATE[k];delete EDIT[k];delete SCHED[k]}
  catch(e){ERR[k]=String(e.message).includes('bad_day')?'التاريخ ده مقفول، سجّل النهارده أو امبارح بس.':'ماتسجلش. اتأكد من النت ودوس تاني.'}
  delete BUSY[k];render()}
$('day').querySelectorAll('button').forEach(b=>b.onclick=()=>{OFF=+b.dataset.d;$('day').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));LATE={};ERR={};EDIT={};SCHED={};load()});
window.addEventListener('hashchange',()=>location.reload());
load();
</script>
</body>
</html>
